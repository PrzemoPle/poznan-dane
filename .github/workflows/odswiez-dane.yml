# Cotygodniowe odświeżenie danych ze źródeł.
#
# Dlaczego co tydzień, a nie rzadziej: BIP zaciąga umowy automatycznie z systemu
# zarządzania dokumentacją urzędu i dopisuje je z opóźnieniem — wstecz, pod datą
# zawarcia. Umowa z 12.06.2026 pojawiła się w rejestrze dopiero po 7.08.2026, więc
# pobranie „raz w miesiącu" zostawiało czytelnika z niekompletną listą przez tygodnie.
#
# GUS i badam.poznan.pl aktualizują się rzadko (dane roczne, kilka razy w roku), ale
# ich pobranie jest tanie i idzie przy okazji.
#
# Z BIP-u pobieramy tylko bieżący i poprzedni rok (FORCE wymusza nadpisanie).
# Starsze roczniki są zamknięte — pełny zaciąg 2014–2026 trwa ~40 min i robi się
# ręcznie: `FORCE=1 npm run etl:umowy`.
#
# Uwaga na `data/raw`: katalog jest poza repozytorium, więc tutaj istnieją wyłącznie
# roczniki pobrane przed chwilą. Agregator dobiera brakujące lata z plików już
# opublikowanych w `public/dane/umowy` — bez tego przeliczenie ścinałoby historię
# do dwóch ostatnich lat (raz już tak się stało, 2026-08-10).

name: Odśwież dane

on:
  schedule:
    - cron: '17 4 * * 1'   # co tydzień w poniedziałki, 4:17 UTC — bieżący i poprzedni rok
    - cron: '17 2 1 * *'   # raz w miesiącu 1. dnia, 2:17 UTC — wszystkie roczniki od 2014
  workflow_dispatch:
    inputs:
      pelny:
        description: 'Pobrać wszystkie roczniki od 2014 (dłużej, ~1,5 h)'
        type: boolean
        default: false

concurrency:
  group: odswiez-dane
  cancel-in-progress: false

jobs:
  odswiez:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write       # commit odświeżonych danych
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pobierz dane ze źródeł
        env:
          # Cotygodniowo wystarczą dwa ostatnie roczniki, ale raz w miesiącu bierzemy
          # wszystko od 2014 — BIP dopisuje umowy wstecz także do dawnych lat i tylko
          # pełny zaciąg to wychwyci.
          PELNY: ${{ github.event.schedule == '17 2 1 * *' || inputs.pelny }}
        run: |
          ROK=$(date -u +%Y)
          if [ "$PELNY" = 'true' ]; then OD=2014; else OD=$((ROK - 1)); fi
          echo "Rejestr BIP: roczniki $OD–$ROK"
          FORCE=1 node etl/fetch-umowy.mjs "$OD" "$ROK"
          # CRU pobieramy w całości: rejestr jest młody i niewielki, a przy okazji
          # sprawdzamy, czy któraś jednostka miejska zaczęła w nim publikować.
          npm run etl:cru
          npm run etl:bdl
          npm run etl:badam
          npm run etl:katalog

      - name: Sprawdź kompletność roczników
        run: npm run etl:sprawdz

      - name: Przelicz agregaty, profile i kartę podglądu
        run: |
          npm run etl:build
          npm run etl:podmioty
          npm run etl:og

      - name: Zapisz zmiany w repozytorium
        id: zapis
        run: |
          git config user.name 'Automat odświeżania'
          git config user.email 'actions@github.com'
          git add public/dane data/podmioty.json public/og.png
          if git diff --cached --quiet; then
            echo "zmienione=nie" >> "$GITHUB_OUTPUT"
            echo "Źródła nie przyniosły nic nowego — nie ma czego commitować."
          else
            echo "zmienione=tak" >> "$GITHUB_OUTPUT"
            git commit -m "Odświeżenie danych ze źródeł ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Zbuduj stronę
        if: steps.zapis.outputs.zmienione == 'tak'
        run: npm run build

      - name: Wdróż
        if: steps.zapis.outputs.zmienione == 'tak'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name poznan-dane --branch main
